<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Технеций">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F5F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1D1A" media="(prefers-color-scheme: dark)">
<title>Технеций⁴³</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Палитра Claude — тёмная */
  --bg:#1F1D1A; --grid:rgba(245,241,235,.04); --surface:#292621; --surface2:#332F29;
  --ink:#F0EBE3; --mute:#A8A196; --bd:#4A443C; --sh:#0D0C0A; --soft:#3A352E;
  --tc:#D97757; --warn:#E8A87C; --hz:#D4A27F; --code:#2A2722; --ar:#8FA88B;
  --disp:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme: dark;
}
/* Светлая тема — основная для Claude */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#F5F1EB; --grid:rgba(31,29,26,.06); --surface:#FAF7F2; --surface2:#EFEAE2;
    --ink:#1F1D1A; --mute:#6B655C; --bd:#1F1D1A; --sh:#1F1D1A; --soft:#DDD6CB;
    --warn:#C15F3C; --code:#EFEAE2; --tc:#D97757; --ar:#7A9176;
    color-scheme: light;
  }
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{
  -webkit-text-size-adjust:100%; overscroll-behavior:none;
  background:var(--bg);
  background-image:
    radial-gradient(640px 320px at 60% 0, color-mix(in srgb, var(--tc) 10%, transparent), transparent),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:auto, 26px 26px, 26px 26px;
}
body{
  color:var(--ink); font:15.5px/1.65 var(--body);
  display:flex; height:100vh; overflow:hidden; touch-action:manipulation;
}
@supports (height: 100dvh){ body{height:100dvh} }
@supports (height: var(--vvh)){ body{height:var(--vvh, 100dvh)} }

button{font:inherit; color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none; background:none; border:none;}
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible{
  outline:3px solid var(--hz); outline-offset:2px;
}

.app{display:flex; width:100%; height:100%; min-width:0; min-height:0; position:relative}

/* ==================== САЙДБАР ==================== */
.sidebar{
  width:292px; flex:none; display:flex; flex-direction:column;
  background:var(--surface); border-right:2px solid var(--bd);
  z-index:8; min-height:0; transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
.sb-top{
  display:flex; align-items:center; gap:10px;
  padding:14px 14px 12px; border-bottom:2px solid var(--bd);
}
.sb-brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.sb-brand strong{font:700 22px/1 var(--disp); letter-spacing:-.01em; white-space:nowrap;}
.sb-brand sup{color:var(--tc); font-size:.55em; margin-left:1px;}
.sb-icon{
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; border:2px solid var(--bd); border-radius:4px;
  font:700 16px/1 var(--disp); color:var(--tc); background:var(--bg);
}

.sb-new-wrap{padding:12px 14px 10px;}
.btn{
  background:var(--tc); color:#fff; border:2px solid var(--bd); border-radius:4px;
  padding:10px 16px; font-weight:600; box-shadow:3px 3px 0 var(--sh);
  transition:transform .1s, box-shadow .1s, background-color .4s;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-family:var(--body);
}
.btn:active, .send:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--sh)}
.btn .kbd{
  font:600 11px/1 ui-monospace,Menlo,monospace;
  background:rgba(0,0,0,.22); color:#fff;
  padding:3px 6px; border-radius:3px; border:1px solid rgba(255,255,255,.3);
}

.sb-sec{
  padding:14px 14px 6px; font:700 11px/1 var(--disp);
  text-transform:uppercase; letter-spacing:.08em; color:var(--mute);
}
.sb-chats{flex:1; min-height:0; overflow-y:auto; padding:0 12px 10px;}
.crow{
  display:flex; align-items:center; border:2px solid var(--bd); border-radius:4px;
  margin:0 0 7px; background:var(--bg); transition:transform .12s, box-shadow .15s, background .15s;
  padding-right: 8px;
}
.crow:hover{background:var(--surface2)}
.crow.on{background:var(--surface); box-shadow:3px 3px 0 var(--c, var(--tc)); border-color: var(--tc);}
.crow-text{flex:1; min-width:0; text-align:left; padding:10px 12px; font-weight:500; color:var(--ink); font-family:var(--body);}
.crow-del{
  display:flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:4px; color:var(--mute); font-size:16px;
}
.crow-del:hover{background:rgba(255,255,255,0.1); color:var(--ink);}

.sb-bottom{padding:14px; border-top:2px solid var(--bd); display:flex; flex-direction:column; gap:10px;}
.argon-card{
  border:2px solid var(--bd); border-radius:4px; background:var(--bg); padding:10px;
}
.argon-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.argon-title{font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; font-family:var(--disp);}
.argon-title::before{content:""; display:inline-block; width:6px; height:6px; background:var(--ar); border-radius:1px;}
.argon-badge{
  font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ar); border:1px solid var(--ar); padding:2px 4px; border-radius:2px;
}
.argon-bar-bg{height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; margin-bottom:6px;}
.argon-bar-fill{height:100%; width:0%; background:var(--ar); transition:width .3s;}
.argon-stats{display:flex; justify-content:space-between; font-size:11px; color:var(--mute); font-family:var(--body);}

.sb-settings{display:flex; gap:8px;}
.sb-settings button{
  flex:1; border:2px solid var(--bd); border-radius:4px; background:var(--bg);
  padding:8px; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px;
  box-shadow:2px 2px 0 var(--sh); transition:transform .1s, box-shadow .1s; font-family:var(--body);
}
.sb-settings button:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--sh);}

/* ==================== ОСНОВНАЯ ОБЛАСТЬ ==================== */
.main{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative;}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-bottom:2px solid var(--bd);
  background:var(--surface); z-index:5;
}
.tb-left{display:flex; align-items:center; gap:12px;}
.tb-title{display:flex; flex-direction:column; gap:4px;}
.tb-title h1{margin:0; font:700 19px/1.2 var(--disp); letter-spacing:-.01em;}
.tb-tags{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--mute); font-weight:600; letter-spacing:.02em; font-family:var(--body);}
.tag-univ{background:var(--tc); color:#fff; padding:2px 6px; border-radius:2px; font-size:10px; font-weight:700;}

.tb-right{display:flex; align-items:center; gap:16px;}
.charge-wrap{display:flex; flex-direction:column; gap:4px; align-items:flex-end;}
.charge-label{font-size:11px; font-weight:600; color:var(--mute); display:flex; align-items:center; gap:6px; font-family:var(--body);}
.charge-bars{display:flex; gap:2px;}
.charge-bar{width:6px; height:12px; background:var(--tc); border-radius:1px;}
.charge-bar.off{background:var(--surface2);}
.tb-icons{display:flex; gap:8px; color:var(--mute);}
.tb-icons button{width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:4px;}
.tb-icons button:hover{background:var(--surface2); color:var(--ink);}

/* ==================== ЧАТ ==================== */
.chat-area{
  flex:1; overflow-y:auto; padding:20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  scroll-behavior:smooth;
}
.welcome{
  text-align:center; max-width:600px; width:100%;
  display:flex; flex-direction:column; align-items:center; gap:20px;
  animation: fadeIn 0.4s ease-out;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

.welcome-icon{
  width:64px; height:64px; border:2px solid var(--bd); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font:700 32px/1 var(--disp); color:var(--tc);
  box-shadow:4px 4px 0 var(--sh); position:relative; background:var(--bg);
}
.welcome-icon::before{
  content:"43"; position:absolute; top:-8px; left:-8px;
  font:700 10px/1 var(--body); background:var(--tc); color:#fff;
  padding:2px 4px; border-radius:2px;
}
.welcome h2{margin:0; font:700 34px/1.15 var(--disp); letter-spacing:-.01em;}
.welcome p{margin:0; color:var(--mute); font-size:15px; max-width:80%; font-family:var(--body);}

.suggestions{display:flex; flex-direction:column; gap:10px; width:100%; margin-top:10px;}
.sugg{
  border:2px solid var(--bd); border-radius:4px; background:var(--surface);
  padding:14px 18px; text-align:left; font-weight:500; font-size:14px;
  transition:transform .1s, box-shadow .1s, background .15s;
  box-shadow:2px 2px 0 var(--sh); font-family:var(--body);
}
.sugg:hover{background:var(--surface2); box-shadow:3px 3px 0 var(--tc); transform:translate(-1px, -1px); border-color:var(--tc);}
.sugg:active{transform:translate(1px, 1px); box-shadow:1px 1px 0 var(--sh);}

/* ==================== ПОЛЕ ВВОДА ==================== */
.input-area{
  padding:0 20px 20px; background:linear-gradient(to top, var(--bg) 60%, transparent);
}
.input-box{
  max-width:800px; margin:0 auto; border:2px solid var(--bd); border-radius:6px;
  background:var(--surface); box-shadow:4px 4px 0 var(--sh);
  display:flex; flex-direction:column; overflow:hidden;
  transition:border-color .2s;
}
.input-box:focus-within{border-color:var(--tc);}
.input-box textarea{
  width:100%; min-height:52px; max-height:200px; resize:none;
  border:none; background:transparent; padding:16px 16px 8px;
  color:var(--ink); font:inherit; outline:none; font-family:var(--body);
}
.input-toolbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px 12px; border-top:1px solid var(--surface2);
}
.input-left{display:flex; align-items:center; gap:12px;}
.model-select{
  display:flex; align-items:center; gap:4px; font-weight:600; font-size:13px;
  color:var(--ink); padding:4px 8px; border-radius:4px; font-family:var(--body);
}
.model-select:hover{background:var(--surface2);}
.input-actions{display:flex; gap:8px; color:var(--mute); align-items:center;}
.input-actions button{width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:4px;}
.input-actions button:hover{background:var(--surface2); color:var(--ink);}
.input-hint{font-size:11px; color:var(--mute); font-family:var(--body);}
.send{
  width:32px; height:32px; background:var(--tc); color:#fff;
  border:2px solid var(--bd); border-radius:4px; box-shadow:2px 2px 0 var(--sh);
  display:flex; align-items:center; justify-content:center;
  transition:transform .1s, box-shadow .1s, opacity .2s;
}
.send:disabled{opacity:0.5; cursor:not-allowed;}

/* ===== РЕЖИМ ЭКСПЕРТА ===== */
.expert-toggle{
  display:flex; align-items:center; gap:6px;
  padding:4px 10px; border:2px solid var(--bd); border-radius:4px;
  background:var(--bg); font-weight:600; font-size:13px;
  box-shadow:2px 2px 0 var(--sh);
  transition:transform .1s, box-shadow .1s, background .15s, border-color .15s;
  font-family:var(--body);
}
.expert-toggle:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--sh);}
.expert-toggle .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--mute); transition:background .2s;
}
.expert-toggle.on{
  border-color:var(--tc); background:var(--surface2); color:var(--tc);
}
.expert-toggle.on .dot{background:var(--tc); box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 25%, transparent);}

/* Адаптив */
@media (max-width: 768px) {
  .sidebar {
    position: absolute; height: 100%; transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
  .tb-icons { display: none; }
  .input-hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <!-- САЙДБАР -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-brand">
        <div class="sb-icon">Tc</div>
        <strong>Технеций <sup>43</sup></strong>
      </div>
      <button class="sb-close" aria-label="Закрыть меню">✕</button>
    </div>
    
    <div class="sb-new-wrap">
      <button class="btn" onclick="createChat()">
        <span>+ Новый чат</span>
        <span class="kbd">ctrl+K</span>
      </button>
    </div>

    <div class="sb-sec">История чатов</div>
    <div class="sb-chats" id="chat-list">
      <div class="crow on">
        <button class="crow-text">Новый чат</button>
        <button class="crow-del" aria-label="Удалить">×</button>
      </div>
    </div>

    <!-- Обучение Argon -->
    <div class="sb-bottom">
      <div class="argon-card">
        <div class="argon-head">
          <div class="argon-title">Обучение Argon</div>
          <div class="argon-badge">Обучается</div>
        </div>
        <div class="argon-bar-bg"><div class="argon-bar-fill" id="argon-progress"></div></div>
        <div class="argon-stats">
          <span>Прогресс: 0% / 65%</span>
          <span>0 пар</span>
        </div>
      </div>
      <div class="sb-settings">
        <button>☀️ Светлая</button>
        <button>⚙️ Настройки</button>
      </div>
    </div>
  </aside>

  <!-- ОСНОВНАЯ ОБЛАСТЬ -->
  <main class="main">
    <header class="topbar">
      <div class="tb-left">
        <div class="sb-icon">Tc</div>
        <div class="tb-title">
          <h1>Технеций 43</h1>
          <div class="tb-tags">
            <span>68%</span>
            <span class="tag-univ">Универсал</span>
          </div>
        </div>
      </div>
      <div class="tb-right">
        <div class="charge-wrap">
          <div class="charge-label">
            <div class="charge-bars">
              <div class="charge-bar"></div><div class="charge-bar"></div><div class="charge-bar"></div>
              <div class="charge-bar"></div><div class="charge-bar"></div><div class="charge-bar"></div>
              <div class="charge-bar"></div><div class="charge-bar off"></div>
            </div>
            Заряд 7/8
          </div>
        </div>
        <div class="tb-icons">
          <button title="Развернуть">⛶</button>
          <button title="Очистить">🗑️</button>
        </div>
      </div>
    </header>

    <!-- ЧАТ -->
    <div class="chat-area" id="chat-area">
      <div class="welcome" id="welcome-screen">
        <div class="welcome-icon">Tc</div>
        <h2>Чем помочь?</h2>
        <p>Активна Технеций 43 (68% · Универсал). Напиши вопрос ниже или выбери подсказку.</p>
        
        <div class="suggestions">
          <button class="sugg">Расскажи про технеций</button>
          <button class="sugg">Придумай шутку про нейросети</button>
          <button class="sugg">Объясни, как работает ИИ</button>
        </div>
      </div>
    </div>

    <!-- ВВОД -->
    <div class="input-area">
      <div class="input-box">
        <textarea id="chat-input" placeholder="Спроси Технеций..." rows="1"></textarea>
        <div class="input-toolbar">
          <div class="input-left">
            <button class="model-select">Технеций 43 · 68% ▾</button>
            <button class="expert-toggle" id="expert-toggle" title="Режим эксперта: более глубокие и подробные ответы">
              <span class="dot"></span>
              <span>Эксперт</span>
            </button>
            <div class="input-actions">
              <button title="Голос">🎤</button>
              <button title="Инструменты">🔧</button>
            </div>
          </div>
          <div class="input-actions">
            <span class="input-hint">Enter — отправить · Shift+Enter — новая строка</span>
            <button class="send" id="send-btn" title="Отправить">↑</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // ===== Элементы =====
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const chatArea = document.getElementById('chat-area');
  const welcomeScreen = document.getElementById('welcome-screen');
  const expertToggle = document.getElementById('expert-toggle');

  // ===== Режим эксперта =====
  let expertMode = false;
  expertToggle.addEventListener('click', () => {
    expertMode = !expertMode;
    expertToggle.classList.toggle('on', expertMode);
    expertToggle.setAttribute('aria-pressed', String(expertMode));
  });

  // Автовысота текстового поля
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    sendBtn.disabled = input.value.trim().length === 0;
  });

  // Отправка по кнопке или Enter
  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    if (welcomeScreen) welcomeScreen.style.display = 'none';

    // Сообщение пользователя
    const msgDiv = document.createElement('div');
    msgDiv.style.cssText = 'align-self:flex-end; background:var(--tc); color:#fff; padding:12px 16px; border-radius:6px; border:2px solid var(--bd); box-shadow:2px 2px 0 var(--sh); max-width:80%; margin-bottom:15px; animation: fadeIn 0.2s; font-family:var(--body);';
    msgDiv.textContent = text;
    chatArea.appendChild(msgDiv);

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    chatArea.scrollTop = chatArea.scrollHeight;

    // Имитация ответа ИИ с учётом режима эксперта
    setTimeout(() => {
      const aiDiv = document.createElement('div');
      aiDiv.style.cssText = 'align-self:flex-start; background:var(--surface); color:var(--ink); padding:12px 16px; border-radius:6px; border:2px solid var(--bd); box-shadow:2px 2px 0 var(--sh); max-width:80%; margin-bottom:15px; animation: fadeIn 0.2s; font-family:var(--body);';
      aiDiv.textContent = expertMode
        ? 'Технеций 43 [Эксперт]: Анализирую запрос углублённо. Пока API не подключён, но в режиме эксперта я бы дал развёрнутый ответ с обоснованием.'
        : 'Технеций 43: Я пока не подключен к API, но я получил твой запрос!';
      chatArea.appendChild(aiDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 1000);
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Подсказки
  document.querySelectorAll('.sugg').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.textContent;
      input.dispatchEvent(new Event('input'));
      input.focus();
    });
  });

  // Демонстрация прогресса Argon
  setTimeout(() => {
    document.getElementById('argon-progress').style.width = '15%';
  }, 1000);
</script>
</body>
</html>
